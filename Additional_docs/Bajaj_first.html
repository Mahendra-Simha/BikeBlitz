<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajaj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="Images\Bajaj-Logo.png">
    <link rel="stylesheet" type="text/css" href="bajaj_first.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="home.html"><img src="Bg remove.png" alt="Logo"></a>
    </div>
    </nav>
    <img src="Images\Bajaj-Logo.png" alt="Bajaj logo" class="main-img">
    <div class="container">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search for bikes...">
            <button onclick="searchBikes()">Search</button>
        </div>
        <div class="box">
            <img src="Images\m50.jpg" alt="m50" class="box-img">
            <h3>Model - Bajaj m50 </h3>
            <p>Price - ₹2000</p>
            <button class="btn">Book Now</button>
        </div>

        <div class="box">
            <img src="Images\m80.jpg" alt="m80" class="box-img">
            <h3>Model - Bajaj m80</h3>
            <p>Price - ₹2000</p>
            <button class="btn">Book Now</button>
        </div>
    </div>
</body>
</html>
